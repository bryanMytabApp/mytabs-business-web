service: mytabs-client-web

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${self:custom.currentStage}
  deploymentPrefix: client
  deploymentBucket:
    name: mytabs-web-client-deploy-${self:custom.currentStage}
    blockPublicAccess: true

custom:
  currentStage: prod
  projectName: keeptabs-web
  sitename: mytabs-business-web-${self:custom.currentStage}
  s3Sync:
    - bucketName: ${self:custom.sitename}
      localDir: build

plugins:
  - serverless-s3-sync
  - serverless-deployment-bucket

resources:
  Resources:
    CloudfrontOAI:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: ${self:custom.sitename}
    StaticSite:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
        BucketName: ${self:custom.sitename}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    StaticSiteS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: StaticSite
        PolicyDocument:
          Statement:
            - Sid: PublicReadForGetBucketObjectsOAI
              Effect: Allow
              Principal:
                AWS: !Join ['',["arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ",Ref: CloudfrontOAI]]
              Action:
                - "s3:get*"
              Resource:
                - !Join ['',["arn:aws:s3:::",Ref: StaticSite]]
                - !Join ['',["arn:aws:s3:::",Ref: StaticSite,/*]]
            - Sid: PublicReadForGetBucketObjects
              Effect: Allow
              Principal: "*"
              Action:
              - s3:GetObject
              Resource:
                Fn::Join: [
                  "", [
                    "arn:aws:s3:::",
                    {
                      "Ref": "StaticSite"
                    },
                    "/*"
                  ]
                ]
    # Security response headers applied to every viewer response.
    # - HSTS / nosniff / frame-deny / referrer-policy are enforced (safe).
    # - CSP is intentionally NOT sent for now: a Report-Only CSP with no
    #   report-to endpoint had no effect and only produced console warnings.
    #   When ready, add an ENFORCED `Content-Security-Policy` custom header here
    #   (not report-only). The enforced HSTS/nosniff/frame-deny/referrer headers
    #   below remain the active protections. See SECURITY_EXCEPTIONS.md (A05).
    SecurityHeadersPolicy:
      Type: AWS::CloudFront::ResponseHeadersPolicy
      Properties:
        ResponseHeadersPolicyConfig:
          Name: ${self:custom.sitename}-security-headers
          Comment: Security headers for mytabs-client-web
          SecurityHeadersConfig:
            StrictTransportSecurity:
              AccessControlMaxAgeSec: 63072000
              IncludeSubdomains: true
              Preload: true
              Override: true
            ContentTypeOptions:
              Override: true
            FrameOptions:
              FrameOption: DENY
              Override: true
            ReferrerPolicy:
              ReferrerPolicy: strict-origin-when-cross-origin
              Override: true
    cloudfront:
      Type: AWS::CloudFront::Distribution
      DependsOn: StaticSite
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: !Join ['',[Ref: StaticSite,.s3.amazonaws.com]]
              Id: !Ref StaticSite
              S3OriginConfig:
                OriginAccessIdentity: !Join ['',["origin-access-identity/cloudfront/",Ref: CloudfrontOAI]]
          Comment: !Ref StaticSite
          Enabled: true
          DefaultRootObject: index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
            TargetOriginId: !Ref StaticSite
            ViewerProtocolPolicy: redirect-to-https
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad #CachingDisabled
          PriceClass: PriceClass_100
          HttpVersion: http2
          IPV6Enabled: true
          ViewerCertificate:
            AcmCertificateArn: arn:aws:acm:us-east-1:992382405895:certificate/e4230952-fb9b-4759-b013-81faeef6518c
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Aliases:
            - keeptabs.app
            - www.keeptabs.app
          CustomErrorResponses:
            - ErrorCachingMinTTL: 5
              ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCachingMinTTL: 5
              ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
  Outputs:
    AdminBucket:
      Value: !Ref StaticSite